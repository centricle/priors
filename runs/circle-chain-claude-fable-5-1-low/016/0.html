<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A circle.">
  <title>Circle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cstyle%3E@media (prefers-color-scheme:dark){circle{fill:%23fff}}%3C/style%3E%3Ccircle cx='200' cy='200' r='200'/%3E%3C/svg%3E">

      display: block;

  </style>

    <svg viewBox="0 0 400 400" role="img" aria-label="Circle">
