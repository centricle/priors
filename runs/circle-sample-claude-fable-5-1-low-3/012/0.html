<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #f4f4f5;
      color: #18181b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    svg {
      display: block;
      width: min(400px, 80vmin);
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.18));
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #18181b;
        color: #f4f4f5;
      }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
    <title id="circle-title">A solid circle</title>
    <circle cx="200" cy="200" r="200" fill="currentColor"/>
  </svg>
</body>
</html>
