<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f5f5;
      --circle: #1a1a1a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --circle: #f5f5f5;
      }
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--bg);
    }

    svg {
      width: min(400px, 80vmin);
      height: auto;
      display: block;
    }

    circle {
      fill: var(--circle);
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
    <title id="circle-title">A solid circle</title>
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
