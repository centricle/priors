<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
    }

    svg {
      width: min(400px, 80vmin);
      height: auto;
      display: block;
    }

    .circle {
      fill: #1e88e5;
    }
  </style>
</head>
<body>
  <svg
    id="ae683f770"
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-labelledby="ae683f770-title"
  >
    <title id="ae683f770-title">Blue circle</title>
    <circle class="circle" cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
