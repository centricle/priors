<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }

    svg {
      display: block;
      width: min(400px, 80vmin);
      height: auto;
      aspect-ratio: 1;
    }

    circle {
      fill: currentColor;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-labelledby="ae683f770-title">
    <title id="ae683f770-title">A solid circle</title>
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
