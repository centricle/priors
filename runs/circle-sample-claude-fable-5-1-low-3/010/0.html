<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      height: 100%;
    }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      color: #111;
      font-family: system-ui, sans-serif;
    }
    svg {
      width: min(400px, 80vw);
      height: auto;
      display: block;
    }
    .circle {
      fill: currentColor;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
    <title id="circle-title">A solid circle</title>
    <circle class="circle" cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
