<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #f6f6f6;
      color: #111;
    }

    .circle {
      display: block;
      width: min(400px, 80vmin);
      height: auto;
      aspect-ratio: 1 / 1;
      fill: currentColor;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
        color: #f2f2f2;
      }
    }
  </style>
</head>
<body>
  <svg class="circle" viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
    <title id="circle-title">A solid circle</title>
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
