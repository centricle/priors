<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      background: #f5f5f5;
    }
    svg {
      display: block;
      width: min(400px, 80vmin);
      height: auto;
      aspect-ratio: 1 / 1;
    }
    circle {
      fill: #111;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #111;
      }
      circle {
        fill: #f5f5f5;
      }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
    <title id="circle-title">A filled circle</title>
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
