<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #f5f5f7;
      color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    svg {
      display: block;
      width: min(400px, 90vw);
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.18));
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111;
        color: #eee;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      svg {
        animation: fade-in 0.6s ease-out both;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-labelledby="ae683f770-title">
    <title id="ae683f770-title">A filled circle</title>
    <defs>
      <radialGradient id="ae683f770-fill" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#4a4a4a"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#ae683f770-fill)"/>
  </svg>
</body>
</html>
