<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }
    circle {
      fill: #6366f1;
      stroke: #4f46e5;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <svg id="circle-display" viewBox="0 0 400 400" role="img" aria-label="A centered circle">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
