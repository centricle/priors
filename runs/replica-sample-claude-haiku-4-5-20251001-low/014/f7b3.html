<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A centered circular design">
  <title>Circle Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #ffffff;
      transition: fill 0.3s ease;
    }
    svg:hover circle {
      fill: #f0f0f0;
    }
  </style>
</head>
<body>
  <svg id="circle-design" viewBox="0 0 400 400" aria-label="A white circle with gradient background">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
