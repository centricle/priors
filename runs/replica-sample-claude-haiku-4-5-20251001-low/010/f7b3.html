<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    h1 {
      color: white;
      font-size: 2rem;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle Viewer</h1>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="200" fill="#667eea" stroke="#764ba2" stroke-width="2"/>
    </svg>
  </div>
</body>
</html>
