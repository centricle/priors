<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
    }
    circle {
      fill: #6366f1;
      transition: fill 0.3s ease;
    }
    circle:hover {
      fill: #4f46e5;
    }
  </style>
</head>
<body>
  <svg id="main-circle" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="200" cursor="pointer"/>
  </svg>
  <script>
    document.querySelector('circle').addEventListener('click', () => {
      const hue = Math.random() * 360;
      document.querySelector('circle').style.fill = `hsl(${hue}, 80%, 50%)`;
    });
  </script>
</body>
</html>
