<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A minimalist animated circle visualization">
  <title>Animated Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      opacity: 0.9;
      font-weight: 300;
      letter-spacing: 1px;
    }
    svg {
      width: 300px;
      height: 300px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: white;
      opacity: 0.95;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% {
        r: 140px;
        opacity: 0.95;
      }
      50% {
        r: 150px;
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>
  <h1>Minimalist Visualization</h1>
  <svg viewBox="0 0 400 400" aria-label="Animated pulsing circle">
    <circle cx="200" cy="200"/>
  </svg>
</body>
</html>
