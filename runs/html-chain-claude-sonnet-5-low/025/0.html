<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Page">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <title>My Page</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #555;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --fg: #e8e8e8;
        --muted: #aaa;
        --accent: #60a5fa;
        --border: #2a2b2e;
      }
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>My Page</h1>
    <p>Welcome. This page is a starting point — replace this text with your own content.</p>
  </main>
  <footer>
    <p>&copy; <span id="year"></span> My Page. All rights reserved.</p>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
