<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1" stroke="url(#grad1)" stroke-width="2"/>

  <!-- Central design -->
  <g transform="translate(100, 100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#grad1)" stroke-width="2"/>

    <!-- Middle ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.7"/>

    <!-- Inner circle -->
    <circle cx="0" cy="0" r="30" fill="url(#grad1)" opacity="0.3"/>

    <!-- Geometric petals -->
    <g stroke="url(#grad1)" stroke-width="2" fill="none">
      <path d="M 0,-50 Q 35,-35 50,0" />
      <path d="M 50,0 Q 35,35 0,50" />
      <path d="M 0,50 Q -35,35 -50,0" />
      <path d="M -50,0 Q -35,-35 0,-50" />
    </g>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="url(#grad1)"/>
  </g>
</svg>
