<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Improved SVG</title>
  <defs>
    <style>
      .background { fill: #f0f0f0; }
      .accent { fill: #3b82f6; }
      .text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  <rect class="background" width="100" height="100" rx="4"/>
  <circle class="accent" cx="50" cy="50" r="30"/>
  <text class="text" x="50" y="58" fill="white">0</text>
</svg>