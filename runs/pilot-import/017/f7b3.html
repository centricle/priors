<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7b3 — Interactive Sphere</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.5));
      cursor: pointer;
      transition: filter 0.3s ease;
    }
    svg:hover {
      filter: drop-shadow(0 30px 80px rgba(100, 200, 255, 0.4));
    }
    circle {
      transition: r 0.4s ease, fill 0.4s ease;
    }
    svg:hover circle {
      r: 210;
      filter: brightness(1.1);
    }
    .info {
      position: absolute;
      bottom: 40px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    svg {
      animation: pulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="sphereGradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#c44569;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#6a0572;stop-opacity:1" />
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <circle cx="200" cy="200" r="200" fill="url(#sphereGradient)" filter="url(#glow)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    </svg>
    <div class="info">Interactive Sphere — Hover to Expand</div>
  </div>
</body>
</html>
