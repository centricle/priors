<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    svg {
      width: 300px;
      height: 300px;
      filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.3));
      animation: pulse 3s ease-in-out infinite;
    }
    circle {
      fill: #ffffff;
      opacity: 0.95;
    }
    h1 {
      color: white;
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sphere</h1>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="sphereGradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="200" fill="url(#sphereGradient)"/>
    </svg>
  </div>
</body>
</html>
