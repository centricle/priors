<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 20px;
    }
    svg {
      width: min(300px, 80vw);
      height: min(300px, 80vw);
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
      cursor: pointer;
    }
    circle {
      transition: all 0.3s ease;
      transform-origin: 200px 200px;
    }
    circle:hover {
      filter: brightness(1.2);
      transform: scale(1.05);
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }
    @keyframes glow {
      0%, 100% {
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
      }
      50% {
        filter: drop-shadow(0 20px 60px rgba(255, 255, 255, 0.2));
      }
    }
    svg.pulsing circle {
      animation: pulse 1s infinite;
    }
    svg.glowing {
      animation: glow 2s infinite;
    }
    h1 {
      color: white;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 600;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 10px 18px;
      border: 2px solid white;
      border-radius: 8px;
      background: white;
      color: #667eea;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      background: #f0f0f0;
    }
    button:active {
      transform: translateY(0);
    }
    button:focus {
      outline: 2px solid white;
      outline-offset: 2px;
    }
    .hint {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
    }
    @media (max-width: 480px) {
      .container {
        gap: 30px;
      }
      .controls {
        gap: 8px;
      }
      button {
        padding: 8px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Circle</h1>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="gradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
          <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.1" />
        </radialGradient>
      </defs>
      <circle class="base-circle" cx="200" cy="200" r="180" fill="#ff6b6b" opacity="0.9"/>
      <circle cx="200" cy="200" r="180" fill="url(#gradient)"/>
    </svg>
    <div class="controls">
      <button onclick="togglePulse()" title="Space">Pulse</button>
      <button onclick="toggleGlow()" title="G">Glow</button>
      <button onclick="changeColor()" title="→">Color</button>
      <button onclick="spin()" title="↻">Spin</button>
    </div>
    <div class="hint">
      Keyboard: <strong>Space</strong> = Pulse · <strong>G</strong> = Glow · <strong>→</strong> = Color · <strong>↻</strong> = Spin
    </div>
  </div>

  <script>
    const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#e74c3c', '#3498db'];
    let colorIndex = 0;
    let isSpinning = false;

    function togglePulse() {
      document.getElementById('ae683f770').classList.toggle('pulsing');
    }

    function toggleGlow() {
      document.getElementById('ae683f770').classList.toggle('glowing');
    }

    function changeColor() {
      colorIndex = (colorIndex + 1) % colors.length;
      document.querySelector('.base-circle').setAttribute('fill', colors[colorIndex]);
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      const svg = document.getElementById('ae683f770');
      svg.style.animation = 'none';
      setTimeout(() => {
        svg.style.animation = 'spin 0.6s ease-in-out';
        setTimeout(() => { isSpinning = false; }, 600);
      }, 10);
    }

    document.addEventListener('keydown', (e) => {
      switch(e.key) {
        case ' ':
          e.preventDefault();
          togglePulse();
          break;
        case 'g':
        case 'G':
          toggleGlow();
          break;
        case 'ArrowRight':
        case 'ArrowLeft':
          changeColor();
          break;
      }
    });

    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
