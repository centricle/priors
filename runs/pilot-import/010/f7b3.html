<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Vision</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
      overflow: hidden;
    }
    .container {
      text-align: center;
      z-index: 10;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
      letter-spacing: -1px;
    }
    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 3rem;
      font-weight: 300;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.3));
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-30px);
      }
    }
    .circle-primary {
      fill: url(#circleGradient);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
    }
    .circle-accent {
      fill: none;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 2;
      animation: spin 20s linear infinite reverse;
    }
    @keyframes spin {
      from {
        transform: rotate(0deg);
        transform-origin: 200px 200px;
      }
      to {
        transform: rotate(360deg);
        transform-origin: 200px 200px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Geometric Vision</h1>
    <p>Explore the intersection of form and motion</p>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="circleGradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#667eea;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle class="circle-primary" cx="200" cy="200" r="140"/>
      <circle class="circle-accent" cx="200" cy="200" r="160"/>
      <circle class="circle-accent" cx="200" cy="200" r="120"/>
      <circle class="circle-accent" cx="200" cy="200" r="80"/>
    </svg>
  </div>
</body>
</html>
