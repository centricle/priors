<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Orb</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3f 100%);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 500px;
      height: 500px;
    }
    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 40px rgba(100, 200, 255, 0.4));
    }
    .orb {
      transition: filter 0.3s ease;
      cursor: pointer;
    }
    .orb:hover {
      filter: brightness(1.3) drop-shadow(0 0 30px rgba(150, 220, 255, 0.8));
    }
    .orb-inner {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 0.8;
      }
      50% {
        opacity: 1;
      }
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(150, 200, 255, 0.6);
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="orbGradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color: #64c8ff; stop-opacity: 1"/>
          <stop offset="100%" style="stop-color: #0066cc; stop-opacity: 1"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g class="orb">
        <circle class="orb-inner" cx="200" cy="200" r="150" fill="url(#orbGradient)" filter="url(#glow)"/>
        <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(100, 220, 255, 0.3)" stroke-width="2"/>
      </g>
    </svg>
    <div class="info">INTERACTIVE ORB</div>
  </div>

  <script>
    const orb = document.querySelector('.orb');
    let angle = 0;

    orb.addEventListener('mousemove', (e) => {
      const rect = orb.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;

      const distance = Math.sqrt(x * x + y * y);
      const maxDistance = 150;

      if (distance < maxDistance) {
        const scaleAmount = 1 + (maxDistance - distance) / maxDistance * 0.15;
        orb.style.transform = `scale(${scaleAmount})`;
      }
    });

    orb.addEventListener('mouseleave', () => {
      orb.style.transform = 'scale(1)';
    });

    orb.addEventListener('click', () => {
      orb.style.animation = 'none';
      setTimeout(() => {
        orb.style.animation = '';
      }, 50);
    });
  </script>
</body>
</html>
