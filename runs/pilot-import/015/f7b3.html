<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ae683f770</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.4));
    }
    defs {
      display: none;
    }
    .gradient-fill {
      fill: url(#orb-gradient);
    }
    .pulse {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
    }
    .rotate {
      animation: rotate 8s linear infinite;
      transform-origin: 200px 200px;
    }
    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400">
    <defs>
      <radialGradient id="orb-gradient" cx="35%" cy="35%">
        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
        <stop offset="70%" style="stop-color:#1e40af;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0c0e1a;stop-opacity:1" />
      </radialGradient>
    </defs>
    <circle class="gradient-fill pulse" cx="200" cy="200" r="200"/>
    <circle class="rotate" cx="200" cy="200" r="200" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="2" stroke-dasharray="10 5"/>
  </svg>
</body>
</html>
