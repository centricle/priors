<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ae683f770</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: url(#gradient);
      transition: r 0.3s ease;
    }
    circle:hover {
      r: 210;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    svg {
      animation: float 3s ease-in-out infinite;
    }
    h1 {
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }
    p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      text-align: center;
      max-width: 400px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Circle</h1>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color: #ffd89b; stop-opacity: 1" />
          <stop offset="100%" style="stop-color: #19547b; stop-opacity: 1" />
        </linearGradient>
      </defs>
      <circle cx="200" cy="200" r="200"/>
    </svg>
    <p>Hover over the circle to interact</p>
  </div>
</body>
</html>
