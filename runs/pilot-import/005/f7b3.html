<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ae683f770</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }

    .container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.6));
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        filter: drop-shadow(0 20px 60px rgba(59, 130, 246, 0.4));
      }
      50% {
        opacity: 0.8;
        filter: drop-shadow(0 20px 80px rgba(59, 130, 246, 0.7));
      }
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .pulse-ring {
      animation: pulse 3s ease-in-out infinite;
    }

    .rotating {
      animation: rotate 20s linear infinite;
      transform-origin: 200px 200px;
    }

    h1 {
      position: absolute;
      top: 40px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .info {
      position: absolute;
      bottom: 40px;
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>ae683f770</h1>

  <div class="container">
    <svg id="ae683f770" viewBox="0 0 400 400" class="pulse-ring">
      <defs>
        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Background subtle circles -->
      <circle cx="200" cy="200" r="210" fill="none" stroke="rgba(59, 130, 246, 0.1)" stroke-width="1"/>
      <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="1"/>

      <!-- Main gradient circle with glow -->
      <circle cx="200" cy="200" r="160" fill="url(#gradient1)" filter="url(#glow)"/>

      <!-- Accent rings -->
      <circle cx="200" cy="200" r="165" fill="none" stroke="url(#gradient1)" stroke-width="2" opacity="0.6"/>
    </svg>
  </div>

  <div class="info">
    Interactive visual element • Built with SVG & CSS
  </div>
</body>
</html>
