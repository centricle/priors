<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 60px rgba(100, 150, 255, 0.3));
    }
    h1 {
      color: #e0e0e0;
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    circle {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { r: 200; opacity: 1; }
      50% { r: 210; opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Radiance</h1>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%">
          <stop offset="0%" style="stop-color:#6496ff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#2196ff;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="200" fill="url(#glow)" stroke="#1a4d99" stroke-width="2"/>
    </svg>
  </div>
</body>
</html>
