<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ae683f770</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 400px;
      height: 400px;
    }
    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .rotating {
      animation: rotate 20s linear infinite;
    }
    .pulsing {
      animation: pulse 3s ease-in-out infinite;
    }
    .center-circle {
      animation: pulse 4s ease-in-out infinite;
    }
    defs {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg id="ae683f770" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="grad1" cx="30%" cy="30%">
          <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.2" />
        </radialGradient>
        <radialGradient id="grad2" cx="50%" cy="50%">
          <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:0.4" />
        </radialGradient>
      </defs>

      <g class="rotating">
        <circle cx="200" cy="200" r="190" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
        <circle cx="200" cy="200" r="170" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
        <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

        <circle cx="200" cy="50" r="12" fill="#ff6b6b" class="pulsing"/>
        <circle cx="350" cy="100" r="12" fill="#4ecdc4" class="pulsing"/>
        <circle cx="350" cy="300" r="12" fill="#ffe66d" class="pulsing"/>
        <circle cx="200" cy="350" r="12" fill="#95e1d3" class="pulsing"/>
        <circle cx="50" cy="300" r="12" fill="#ff6b6b" class="pulsing"/>
        <circle cx="50" cy="100" r="12" fill="#4ecdc4" class="pulsing"/>
      </g>

      <circle cx="200" cy="200" r="200" fill="url(#grad1)" opacity="0.6"/>
      <circle cx="200" cy="200" r="180" fill="none" stroke="url(#grad2)" stroke-width="8" opacity="0.7"/>
      <circle cx="200" cy="200" r="120" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

      <circle cx="200" cy="200" r="80" fill="#ffffff" opacity="0.1" class="center-circle"/>
      <circle cx="200" cy="200" r="60" fill="url(#grad2)" opacity="0.5"/>
      <circle cx="200" cy="200" r="40" fill="#ffffff" opacity="0.3"/>
      <circle cx="200" cy="200" r="20" fill="#667eea" opacity="0.8"/>
    </svg>
  </div>
</body>
</html>
