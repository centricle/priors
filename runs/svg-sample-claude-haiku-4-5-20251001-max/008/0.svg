<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.2"/>

  <g transform="translate(100, 100)">
    <circle r="60" fill="url(#grad1)"/>
    <circle r="45" fill="white" opacity="0.1"/>
    <circle r="30" fill="url(#grad2)"/>

    <g opacity="0.8">
      <path d="M -10,-10 L 10,-10 L 0,10 Z" fill="white" transform="rotate(0)"/>
      <path d="M -10,-10 L 10,-10 L 0,10 Z" fill="white" transform="rotate(90)"/>
      <path d="M -10,-10 L 10,-10 L 0,10 Z" fill="white" transform="rotate(180)"/>
      <path d="M -10,-10 L 10,-10 L 0,10 Z" fill="white" transform="rotate(270)"/>
    </g>
  </g>
</svg>
