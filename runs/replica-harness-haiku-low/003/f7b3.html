<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    h1 {
      color: white;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gradient Circle</h1>
    <svg viewBox="0 0 400 400">
      <defs>
        <radialGradient id="circleGradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="180" fill="url(#circleGradient)" stroke="white" stroke-width="4"/>
    </svg>
  </div>
</body>
</html>
