<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    svg {
      width: 80vmin;
      height: 80vmin;
      max-width: 400px;
      max-height: 400px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
    }
    circle {
      fill: none;
      stroke: white;
      stroke-width: 3;
      transition: stroke-width 0.3s ease;
    }
    svg:hover circle {
      stroke-width: 5;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" aria-label="Animated circle">
    <title>Circle Illustration</title>
    <circle cx="200" cy="200" r="180" />
  </svg>
</body>
</html>
