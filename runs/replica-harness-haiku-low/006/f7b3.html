<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.2));
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400">
    <defs>
      <radialGradient id="circleGradient" cx="35%" cy="35%">
        <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
        <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.4" />
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#circleGradient)" stroke="#764ba2" stroke-width="3"/>
  </svg>
</body>
</html>
