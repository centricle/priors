<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a;
      }
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.1));
    }
    @media (prefers-color-scheme: dark) {
      svg {
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
      }
    }
    circle {
      fill: #3b82f6;
      stroke: #1e40af;
      stroke-width: 2;
      transition: fill 0.3s ease;
    }
    circle:hover {
      fill: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      circle {
        fill: #60a5fa;
        stroke: #3b82f6;
      }
      circle:hover {
        fill: #93c5fd;
      }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="Centered blue circle">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
