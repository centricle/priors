<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }
    circle {
      fill: #2563eb;
      transition: fill 0.3s ease;
    }
    svg:hover circle {
      fill: #1d4ed8;
    }
  </style>
</head>
<body>
  <svg id="circle-graphic" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="200" aria-label="Blue circle"/>
  </svg>
</body>
</html>
