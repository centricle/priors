<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minimal geometric visualization">
  <title>Geometric Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #ffffff;
      transition: fill 0.3s ease;
    }
    svg:hover circle {
      fill: #f0f0f0;
    }
    h1 {
      color: white;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="White circle on gradient background">
      <circle cx="200" cy="200" r="200"/>
    </svg>
    <h1>Geometric Form</h1>
  </div>
</body>
</html>
