<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
    }
    circle {
      fill: #3b82f6;
      transition: fill 0.3s ease;
    }
    circle:hover {
      fill: #2563eb;
    }
  </style>
</head>
<body>
  <svg id="visualization" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
