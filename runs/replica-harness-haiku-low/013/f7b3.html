<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
    }
    svg {
      width: 400px;
      height: 400px;
      max-width: 90vw;
      max-height: 90vh;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-label="Blue circle">
    <circle cx="200" cy="200" r="200" fill="#2563eb"/>
  </svg>
</body>
</html>
