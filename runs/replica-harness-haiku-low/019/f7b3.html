<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    svg {
      width: 400px;
      height: 400px;
    }
  </style>
</head>
<body>
  <svg id="circle-demo" viewBox="0 0 400 400" aria-label="A blue circle">
    <desc>Demonstration circle with blue fill and dark stroke</desc>
    <circle cx="200" cy="200" r="200" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  </svg>
</body>
</html>
