<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #18181b;
      }
    }
    svg {
      width: min(80vw, 80vh, 400px);
      height: min(80vw, 80vh, 400px);
    }
    .circle {
      fill: url(#circle-gradient);
      transition: transform 0.3s ease;
      transform-origin: center;
    }
    svg:hover .circle {
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
    <title id="circle-title">A circle</title>
    <defs>
      <radialGradient id="circle-gradient" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#312e81"/>
      </radialGradient>
    </defs>
    <circle class="circle" cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
