<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f5f7;
      --circle-start: #6a8dff;
      --circle-end: #9b5cff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11131a;
      }
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
    }

    .circle-figure {
      width: min(80vmin, 400px);
      aspect-ratio: 1;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .circle {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.94); }
    }

    @media (prefers-reduced-motion: reduce) {
      .circle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <figure class="circle-figure">
    <svg viewBox="0 0 400 400" role="img" aria-labelledby="circle-title">
      <title id="circle-title">A circle with a blue-to-purple gradient</title>
      <defs>
        <linearGradient id="circle-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--circle-start)"/>
          <stop offset="100%" stop-color="var(--circle-end)"/>
        </linearGradient>
      </defs>
      <circle class="circle" cx="200" cy="200" r="196" fill="url(#circle-gradient)"/>
    </svg>
  </figure>
</body>
</html>
