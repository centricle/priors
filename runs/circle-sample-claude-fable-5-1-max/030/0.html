<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #18181b; }
    }
    svg {
      width: min(80vw, 80vh);
      height: min(80vw, 80vh);
      display: block;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.25));
    }
    .circle {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.94); }
    }
    @media (prefers-reduced-motion: reduce) {
      .circle { animation: none; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-label="A circle with a blue-to-purple gradient">
    <defs>
      <radialGradient id="fill" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#60a5fa"/>
        <stop offset="60%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </radialGradient>
    </defs>
    <circle class="circle" cx="200" cy="200" r="190" fill="url(#fill)"/>
  </svg>
</body>
</html>
