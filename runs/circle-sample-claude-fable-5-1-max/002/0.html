<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Orb</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
    }
    svg {
      width: min(80vw, 80vh, 400px);
      height: min(80vw, 80vh, 400px);
      filter: drop-shadow(0 20px 45px rgba(79, 172, 254, 0.45));
      animation: float 6s ease-in-out infinite;
    }
    .orb {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      svg, .orb { animation: none; }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-labelledby="orb-title">
    <title id="orb-title">A glowing blue orb</title>
    <defs>
      <radialGradient id="orbFill" cx="38%" cy="32%" r="72%">
        <stop offset="0%"   stop-color="#e6f7ff"/>
        <stop offset="28%"  stop-color="#6fd3fe"/>
        <stop offset="70%"  stop-color="#2f80ed"/>
        <stop offset="100%" stop-color="#0a2a6b"/>
      </radialGradient>
      <radialGradient id="orbHighlight" cx="35%" cy="28%" r="30%">
        <stop offset="0%"   stop-color="rgba(255,255,255,0.9)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
    </defs>
    <g class="orb">
      <circle cx="200" cy="200" r="195" fill="url(#orbFill)"/>
      <ellipse cx="150" cy="130" rx="70" ry="45" fill="url(#orbHighlight)"/>
    </g>
  </svg>
</body>
</html>
