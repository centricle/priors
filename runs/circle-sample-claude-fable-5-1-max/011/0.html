<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #18181b;
      }
    }

    .circle {
      width: min(80vw, 80vh, 400px);
      height: auto;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
      transition: transform 0.3s ease;
    }

    .circle:hover {
      transform: scale(1.03);
    }

    .circle circle {
      transform-origin: center;
      animation: fade-in 0.6s ease both;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .circle,
      .circle circle {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg
    class="circle"
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-labelledby="circle-title circle-desc"
  >
    <title id="circle-title">Circle</title>
    <desc id="circle-desc">A single circle filled with a blue gradient.</desc>
    <defs>
      <radialGradient id="circle-fill" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#60a5fa" />
        <stop offset="100%" stop-color="#2563eb" />
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#circle-fill)" />
  </svg>
</body>
</html>
