<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #18181b;
      }
    }

    svg {
      width: min(400px, 80vmin);
      height: min(400px, 80vmin);
    }

    .circle {
      fill: url(#gradient);
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.94); }
    }

    @media (prefers-reduced-motion: reduce) {
      .circle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-label="A circle with a blue-to-purple gradient">
    <title>Gradient circle</title>
    <defs>
      <radialGradient id="gradient" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </radialGradient>
    </defs>
    <circle class="circle" cx="200" cy="200" r="190"/>
  </svg>
</body>
</html>
