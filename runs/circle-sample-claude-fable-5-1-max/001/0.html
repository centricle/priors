<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #1b2735, #090a0f);
      padding: 1.5rem;
    }

    .stage {
      width: min(400px, 80vmin);
      aspect-ratio: 1;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .disc {
      filter: drop-shadow(0 0 24px rgba(99, 179, 237, 0.45));
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .disc {
        animation: none;
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
      <title id="title">Circle</title>
      <desc id="desc">A single filled circle centered on a dark background.</desc>
      <defs>
        <radialGradient id="fill" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#9ae6ff"/>
          <stop offset="55%" stop-color="#4299e1"/>
          <stop offset="100%" stop-color="#1a365d"/>
        </radialGradient>
      </defs>
      <circle class="disc" cx="200" cy="200" r="190" fill="url(#fill)"/>
    </svg>
  </div>
</body>
</html>
