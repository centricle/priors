<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 20%, #1b2735, #090a0f 70%);
    }

    .stage {
      width: min(80vw, 80vh, 400px);
      aspect-ratio: 1;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.55));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(-2%); }
      50%      { transform: translateY(2%); }
    }

    @media (prefers-reduced-motion: reduce) {
      svg { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
      <title id="title">Circle</title>
      <desc id="desc">A glowing blue sphere centered on a dark background.</desc>
      <defs>
        <radialGradient id="sphere" cx="38%" cy="32%" r="75%">
          <stop offset="0%"  stop-color="#9fe8ff"/>
          <stop offset="45%" stop-color="#3aa0ff"/>
          <stop offset="100%" stop-color="#0b3b8c"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="195" fill="url(#sphere)"/>
    </svg>
  </div>
</body>
</html>
