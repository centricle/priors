<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #f5f7fa 0%, #dde3ec 100%);
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: radial-gradient(circle at 50% 35%, #1b2130 0%, #0b0e16 100%);
      }
    }
    svg {
      width: min(80vw, 80vh, 400px);
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 32px rgba(40, 70, 140, 0.35));
    }
    .disc {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.94); }
    }
    @media (prefers-reduced-motion: reduce) {
      .disc { animation: none; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-labelledby="title">
    <title id="title">A circle</title>
    <defs>
      <radialGradient id="fill" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#6ea8fe"/>
        <stop offset="55%" stop-color="#3b66d6"/>
        <stop offset="100%" stop-color="#1b327e"/>
      </radialGradient>
    </defs>
    <circle class="disc" cx="200" cy="200" r="190" fill="url(#fill)"/>
  </svg>
</body>
</html>
