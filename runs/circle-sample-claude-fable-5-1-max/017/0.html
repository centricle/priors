<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #1b2735 0%, #090a0f 100%);
    }
    svg {
      width: min(80vw, 80vh, 400px);
      height: auto;
      aspect-ratio: 1 / 1;
      filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.45));
    }
    .disc {
      transform-box: fill-box;
      transform-origin: center;
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.94); }
    }
    @media (prefers-reduced-motion: reduce) {
      .disc { animation: none; }
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img"
       aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
    <title id="title">Gradient circle</title>
    <desc id="desc">A circle filled with a blue-to-violet radial gradient.</desc>
    <defs>
      <radialGradient id="fill" cx="38%" cy="32%" r="75%">
        <stop offset="0%"   stop-color="#8ec5ff"/>
        <stop offset="45%"  stop-color="#4a6cf7"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </radialGradient>
    </defs>
    <circle class="disc" cx="200" cy="200" r="196" fill="url(#fill)"/>
  </svg>
</body>
</html>
