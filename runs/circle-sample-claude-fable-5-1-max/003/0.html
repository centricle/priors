<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f5f7;
      --circle-start: #6366f1;
      --circle-end: #a855f7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
      }
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      padding: 1.5rem;
    }

    svg {
      width: min(80vmin, 400px);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 25px rgba(79, 70, 229, 0.35));
      transition: transform 0.3s ease;
    }

    svg:hover {
      transform: scale(1.03);
    }

    circle {
      fill: url(#circleGradient);
    }

    @media (prefers-reduced-motion: no-preference) {
      svg {
        animation: fade-in 0.6s ease both;
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
    <title id="title">Circle</title>
    <desc id="desc">A circle filled with an indigo-to-purple gradient.</desc>
    <defs>
      <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--circle-start)" />
        <stop offset="100%" stop-color="var(--circle-end)" />
      </linearGradient>
    </defs>
    <circle cx="200" cy="200" r="200" />
  </svg>
</body>
</html>
