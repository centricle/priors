<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #1b2735 0%, #090a0f 100%);
    }
    svg {
      width: min(80vw, 80vh, 400px);
      height: auto;
      display: block;
    }
    .orb {
      transform-origin: center;
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-label="A glowing blue circle">
    <title>A glowing blue circle</title>
    <defs>
      <radialGradient id="fill" cx="40%" cy="35%" r="75%">
        <stop offset="0%"  stop-color="#7fd3ff"/>
        <stop offset="55%" stop-color="#2b8cff"/>
        <stop offset="100%" stop-color="#0b3d91"/>
      </radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="12" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <circle class="orb" cx="200" cy="200" r="180" fill="url(#fill)" filter="url(#glow)"/>
  </svg>
</body>
</html>
