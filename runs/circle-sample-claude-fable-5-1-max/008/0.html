<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #1b2735 0%, #090a0f 100%);
    }

    .figure {
      width: min(400px, 80vw);
      height: min(400px, 80vw);
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.45));
      animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .figure circle {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      .figure,
      .figure circle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg class="figure" viewBox="0 0 400 400"
       role="img" aria-labelledby="title desc">
    <title id="title">Circle</title>
    <desc id="desc">A single circle centered on the page.</desc>
    <defs>
      <radialGradient id="fill" cx="38%" cy="32%" r="75%">
        <stop offset="0%"  stop-color="#8ec5ff"/>
        <stop offset="55%" stop-color="#4f8cff"/>
        <stop offset="100%" stop-color="#2b4bd1"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="198" fill="url(#fill)"/>
  </svg>
</body>
</html>
