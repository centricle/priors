<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      padding: 2rem;
    }

    svg {
      width: min(400px, 80vmin);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(56, 189, 248, 0.35));
    }

    .disc {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.94); }
    }

    @media (prefers-reduced-motion: reduce) {
      .disc {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
    <title id="title">Circle</title>
    <desc id="desc">A circle filled with a blue gradient.</desc>
    <defs>
      <radialGradient id="fill" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="55%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </radialGradient>
    </defs>
    <circle class="disc" cx="200" cy="200" r="198" fill="url(#fill)"/>
  </svg>
</body>
</html>
