<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Circle</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #1b2735 0%, #090a0f 100%);
    }
    svg {
      width: min(80vw, 80vh);
      height: min(80vw, 80vh);
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.45));
    }
    .orb {
      transform-origin: center;
      animation: breathe 6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .orb {
        animation: none;
      }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.94); }
    }
  </style>
</head>
<body>
  <svg
    id="ae683f770"
    viewBox="0 0 400 400"
    role="img"
    aria-labelledby="title desc"
  >
    <title id="title">Gradient circle</title>
    <desc id="desc">A softly glowing circle with a blue-to-violet gradient.</desc>
    <defs>
      <radialGradient id="fill" cx="40%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#8ec5ff"/>
        <stop offset="55%" stop-color="#4f7cff"/>
        <stop offset="100%" stop-color="#7a2ff7"/>
      </radialGradient>
    </defs>
    <circle class="orb" cx="200" cy="200" r="190" fill="url(#fill)"/>
  </svg>
</body>
</html>
