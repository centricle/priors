<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A decorative circle rendered with scalable vector graphics.">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #18181b;
      }
    }

    .circle {
      width: min(400px, 80vmin);
      height: min(400px, 80vmin);
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.25));
    }

    .circle circle {
      fill: url(#circleGradient);
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.96); }
    }

    @media (prefers-reduced-motion: reduce) {
      .circle circle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg class="circle" viewBox="0 0 400 400" role="img" aria-label="A blue circle">
    <title>A blue circle</title>
    <defs>
      <radialGradient id="circleGradient" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#2563eb"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="198"/>
  </svg>
</body>
</html>
