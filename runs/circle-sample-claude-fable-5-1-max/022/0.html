<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Circle</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-start: #f5f7fa;
      --bg-end: #e4ecf5;
      --glow: rgba(79, 124, 255, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-start: #0f1420;
        --bg-end: #1b2436;
        --glow: rgba(79, 124, 255, 0.45);
      }
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, var(--bg-start), var(--bg-end));
    }

    .stage {
      width: clamp(200px, 70vmin, 440px);
      aspect-ratio: 1;
      filter: drop-shadow(0 12px 40px var(--glow));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .orb {
      transform-box: fill-box;
      transform-origin: center;
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.94); }
      50%      { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 400 400" role="img" aria-label="A glowing blue circle">
      <defs>
        <radialGradient id="orbFill" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#8fb3ff"/>
          <stop offset="55%" stop-color="#4f7cff"/>
          <stop offset="100%" stop-color="#1e3a8a"/>
        </radialGradient>
      </defs>
      <circle class="orb" cx="200" cy="200" r="190" fill="url(#orbFill)"/>
    </svg>
  </div>
</body>
</html>
