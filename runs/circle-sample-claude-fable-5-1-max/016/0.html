<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --accent-light: #6ea8fe;
      --accent-dark: #1b4fd1;
      --glow: rgba(27, 79, 209, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --accent-light: #7cc0ff;
        --accent-dark: #1b4fd1;
        --glow: rgba(124, 192, 255, 0.35);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
    }

    svg {
      width: clamp(200px, 60vmin, 400px);
      height: clamp(200px, 60vmin, 400px);
    }

    .disc {
      transform-origin: center;
      animation: pulse 4s ease-in-out infinite;
      filter: drop-shadow(0 0 16px var(--glow));
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.94); }
    }

    @media (prefers-reduced-motion: reduce) {
      .disc {
        animation: none;
      }
    }

    #fill .stop-start { stop-color: var(--accent-light); }
    #fill .stop-end { stop-color: var(--accent-dark); }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-label="A blue circle">
    <title>A blue circle</title>
    <defs>
      <radialGradient id="fill" cx="38%" cy="35%" r="75%">
        <stop class="stop-start" offset="0%"/>
        <stop class="stop-end" offset="100%"/>
      </radialGradient>
    </defs>
    <circle class="disc" cx="200" cy="200" r="198" fill="url(#fill)"/>
  </svg>
</body>
</html>
