<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f7;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
    }
    circle {
      fill: #3b82f6;
      transition: fill 0.2s ease;
    }
    circle:hover {
      fill: #2563eb;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="190"/>
  </svg>
</body>
</html>
