<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 400px;
      max-height: 400px;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 400 400" role="img" aria-label="A solid circle">
    <defs>
      <radialGradient id="circleGradient" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#4f8cff"/>
        <stop offset="100%" stop-color="#1e3a8a"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="190" fill="url(#circleGradient)"/>
  </svg>
</body>
</html>
