<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }
    svg {
      width: 400px;
      height: 400px;
      max-width: 90vw;
      max-height: 90vh;
    }
    circle {
      fill: #4a90d9;
      stroke: #2c5f8a;
      stroke-width: 4;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="Blue circle">
    <circle cx="200" cy="200" r="198"/>
  </svg>
</body>
</html>
