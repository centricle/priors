<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 {
      color: white;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #fff;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 2;
      animation: pulse 3s infinite;
    }
    @keyframes pulse {
      0%, 100% { r: 200px; opacity: 1; }
      50% { r: 210px; opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CIRCLE</h1>
    <svg id="ae683f770" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </div>
</body>
</html>
