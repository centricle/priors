<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      text-align: center;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
      animation: rotate 20s linear infinite;
    }
    circle {
      fill: url(#gradient);
      stroke: white;
      stroke-width: 3;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    h1 {
      color: white;
      margin-top: 40px;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg id="ae683f770" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="gradient" cx="35%" cy="35%">
          <stop offset="0%" style="stop-color:#ff9a56;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="200"/>
    </svg>
    <h1>Dynamic Circle</h1>
  </div>
</body>
</html>
