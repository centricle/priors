<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    svg {
      width: min(400px, 90vw);
      height: min(400px, 90vw);
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: none;
      stroke: white;
      stroke-width: 3;
      animation: pulse 3s ease-in-out infinite;
    }
    h1 {
      color: white;
      font-size: 24px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        stroke-width: 3;
      }
      50% {
        opacity: 0.7;
        stroke-width: 4;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle</h1>
    <svg id="circle-visualization" viewBox="0 0 400 400" aria-label="Animated circle">
      <circle cx="200" cy="200" r="200" />
    </svg>
  </div>
</body>
</html>
