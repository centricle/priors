<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Design</title>
  <meta name="description" content="A responsive circular design visualization">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #ffffff;
      stroke: #667eea;
      stroke-width: 3;
      transition: all 0.3s ease;
    }
    circle:hover {
      fill: #667eea;
      stroke: #ffffff;
      stroke-width: 4;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
