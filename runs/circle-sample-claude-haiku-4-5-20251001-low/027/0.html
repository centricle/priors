<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An elegant centered circle visualization">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 400px;
      max-height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: white;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    circle:hover {
      filter: brightness(1.1);
      stroke-width: 4;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" aria-label="Centered circle">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
