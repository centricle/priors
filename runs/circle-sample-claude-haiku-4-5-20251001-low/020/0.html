<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, centered circular visualization">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }

    circle {
      fill: #ffffff;
      transition: fill 0.3s ease;
    }

    svg:hover circle {
      fill: #e0e0e0;
    }

    h1 {
      color: white;
      font-size: 28px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      svg {
        width: 300px;
        height: 300px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle Visualization</h1>
    <svg viewBox="0 0 400 400" role="img" aria-label="A white circle on a purple gradient background">
      <circle cx="200" cy="200" r="200" />
    </svg>
  </div>
</body>
</html>
