<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e1e2e;
    }
    svg {
      width: min(400px, 80vmin);
      height: min(400px, 80vmin);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }
    circle {
      fill: #6c5ce7;
      transition: fill 0.2s ease;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="A purple circle">
    <circle cx="200" cy="200" r="198"/>
  </svg>
</body>
</html>
