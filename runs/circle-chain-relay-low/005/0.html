<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Animated Circle - Interactive Demo</title>
  <meta name="description" content="A responsive, accessible animated circle with hover effects">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #fff;
      --fg: #2563eb;
      --shadow: rgba(0, 0, 0, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --fg: #60a5fa;
        --shadow: rgba(0, 0, 0, 0.6);
      }
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    svg {
      display: block;
      width: min(400px, 100%);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 8px 16px var(--shadow));
    }
    circle {
      transition: opacity 0.3s ease;
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0.9;
    }
    circle:hover,
    circle:active {
      opacity: 1;
    }
    @media (prefers-reduced-motion: no-preference) {
      circle {
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.3s ease;
      }
      circle:hover,
      circle:active {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 400 400" role="img" aria-label="Animated interactive circle" xmlns="http://www.w3.org/2000/svg">
      <circle cx="200" cy="200" r="180" fill="currentColor"/>
    </svg>
  </main>
</body>
</html>
