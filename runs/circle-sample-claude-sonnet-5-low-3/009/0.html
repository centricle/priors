<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
    }
    svg {
      width: 400px;
      height: 400px;
      max-width: 90vmin;
      max-height: 90vmin;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="A solid blue circle">
    <circle cx="200" cy="200" r="190" fill="#3b82f6"/>
  </svg>
</body>
</html>
