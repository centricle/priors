<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A centered circle visualization">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    h1 {
      color: white;
      font-size: 2rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    svg {
      width: 300px;
      height: 300px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
    }

    circle {
      fill: #4f46e5;
      transition: fill 0.3s ease;
    }

    circle:hover {
      fill: #6366f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle Visualization</h1>
    <svg viewBox="0 0 400 400" aria-label="A blue circle">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </div>
</body>
</html>
