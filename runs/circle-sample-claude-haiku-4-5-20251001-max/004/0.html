<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      text-align: center;
    }

    svg {
      max-width: 90vmin;
      height: auto;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }

    circle {
      fill: #ffffff;
      transition: fill 0.3s ease;
    }

    svg:hover circle {
      fill: #e8e8ff;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle</h1>
    <svg viewBox="0 0 400 400" role="img" aria-label="A white circle on a gradient background">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </div>
</body>
</html>
