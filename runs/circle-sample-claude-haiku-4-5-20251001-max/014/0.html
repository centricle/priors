<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    h1 {
      color: white;
      margin-top: 30px;
      font-size: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="A blue gradient circle">
    <defs>
      <radialGradient id="circleGradient" cx="40%" cy="40%">
        <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#circleGradient)" stroke="#2c5aa0" stroke-width="2"/>
  </svg>
  <h1>Circle Visualization</h1>
</body>
</html>
