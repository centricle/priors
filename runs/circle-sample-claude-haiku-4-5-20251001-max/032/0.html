<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A minimalist circular design with smooth animations">
  <title>Circle Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: none;
      stroke: white;
      stroke-width: 3;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% {
        r: 180;
        opacity: 1;
      }
      50% {
        r: 200;
        opacity: 0.7;
      }
    }
    h1 {
      color: white;
      font-size: 28px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle Animation</h1>
    <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="Animated circle with pulsing effect">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </div>
</body>
</html>
