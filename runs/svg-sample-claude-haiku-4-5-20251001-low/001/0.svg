<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#f8f9fa"/>

  <!-- Geometric shapes -->
  <circle cx="100" cy="100" r="80" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="40" fill="#fff" opacity="0.9"/>

  <!-- Accent dots -->
  <circle cx="100" cy="60" r="4" fill="#667eea"/>
  <circle cx="140" cy="100" r="4" fill="#764ba2"/>
  <circle cx="100" cy="140" r="4" fill="#667eea"/>
  <circle cx="60" cy="100" r="4" fill="#764ba2"/>
</svg>