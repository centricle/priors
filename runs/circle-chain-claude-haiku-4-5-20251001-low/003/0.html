<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .circle-container {
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .circle-container:hover,
    .circle-container:focus {
      transform: scale(1.05);
      outline: none;
    }
    .circle-container:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.5);
      outline-offset: 8px;
      border-radius: 50%;
    }
    svg {
      width: min(400px, 80vw);
      height: min(400px, 80vw);
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
      display: block;
      transition: filter 0.3s ease;
    }
    circle {
      fill: #ffffff;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 2;
      transition: fill 0.3s ease, r 0.3s ease;
      animation: pulse 3s ease-in-out infinite;
    }
    .circle-container:hover circle,
    .circle-container:focus circle {
      fill: #e8f4f8;
      r: 205;
    }
    .circle-container.active circle {
      fill: #ffd700;
      animation: pulse-active 0.6s ease-in-out;
    }
    .circle-container.active:hover circle {
      fill: #ffed4e;
    }
    .circle-container.active svg {
      filter: drop-shadow(0 20px 40px rgba(255, 215, 0, 0.5));
    }
    @keyframes pulse {
      0%, 100% { r: 200; }
      50% { r: 202; }
    }
    @keyframes pulse-active {
      0% { r: 200; }
      50% { r: 210; }
      100% { r: 200; }
    }
  </style>
</head>
<body>
  <button class="circle-container" id="decorative-circle" aria-label="Interactive circle, click or press space to activate">
    <svg viewBox="0 0 400 400" role="presentation">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </button>

  <script>
    const circle = document.getElementById('decorative-circle');

    circle.addEventListener('click', () => {
      circle.classList.toggle('active');
    });

    circle.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        circle.click();
      }
    });
  </script>
</body>
</html>
