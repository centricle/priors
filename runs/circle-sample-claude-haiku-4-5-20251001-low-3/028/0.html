<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A centered circle visualization">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #ffffff;
      stroke: #667eea;
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    svg:hover circle {
      fill: #f0f0f0;
      stroke: #764ba2;
      stroke-width: 3;
    }
    h1 {
      color: white;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle Visualization</h1>
    <svg id="circle-graphic" viewBox="0 0 400 400" role="img" aria-label="A white circle with a gradient border">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </div>
</body>
</html>
