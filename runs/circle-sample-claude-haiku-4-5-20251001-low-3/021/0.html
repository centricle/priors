<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A centered circle design">
  <title>Circle Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    h1 {
      color: white;
      font-size: 2rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    svg {
      width: 100%;
      height: auto;
      max-width: 400px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #fff;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    circle:hover {
      fill: #f0f0f0;
      stroke: white;
      stroke-width: 3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Circle</h1>
    <svg viewBox="0 0 400 400" role="img" aria-label="A white circle on gradient background">
      <circle cx="200" cy="200" r="200"/>
    </svg>
  </div>
</body>
</html>
