<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#grad1)" opacity="0.1"/>

  <!-- Central decorative circle -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.4"/>

  <!-- Central dot -->
  <circle cx="100" cy="100" r="8" fill="url(#grad1)"/>

  <!-- Radiating elements -->
  <g opacity="0.8">
    <line x1="100" y1="40" x2="100" y2="60" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="140" x2="100" y2="160" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="100" x2="60" y2="100" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="100" x2="160" y2="100" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent dots -->
  <circle cx="100" cy="50" r="3" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="100" cy="150" r="3" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="50" cy="100" r="3" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="150" cy="100" r="3" fill="url(#grad1)" opacity="0.8"/>
</svg>