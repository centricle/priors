<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" opacity="0.1"/>

  <!-- Main shape -->
  <circle cx="100" cy="100" r="60" fill="url(#grad)"/>

  <!-- Accent element -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Center detail -->
  <circle cx="100" cy="100" r="8" fill="white" opacity="0.8"/>
</svg>