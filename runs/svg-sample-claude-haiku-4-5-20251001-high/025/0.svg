<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" />

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="white" stroke-width="2" opacity="0.3" />

  <!-- Inner void (representing 0) -->
  <circle cx="100" cy="100" r="50" fill="white" opacity="0.1" />

  <!-- Accent circle -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="white" stroke-width="3" opacity="0.6" />
</svg>