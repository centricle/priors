<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .circle-bg { fill: #e8f4f8; }
      .circle-border { stroke: #0066cc; stroke-width: 2; fill: none; }
      .text-zero { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 120px; font-weight: bold; fill: #0066cc; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle class="circle-bg" cx="100" cy="100" r="95"/>

  <!-- Border circle -->
  <circle class="circle-border" cx="100" cy="100" r="95"/>

  <!-- Zero text -->
  <text class="text-zero" x="100" y="110">0</text>
</svg>
