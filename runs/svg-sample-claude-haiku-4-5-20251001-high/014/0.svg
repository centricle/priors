<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Geometric Circle</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#grad)" opacity="0.9"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
</svg>