<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Black circle</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #fff;
    }
    svg {
      display: block;
      width: min(400px, 90vmin);
      height: auto;
      aspect-ratio: 1;
      overflow: visible;
    }
  </style>
</head>
<body>
  <main>
    <svg id="ae683f770" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="ae683f770-title">
      <title id="ae683f770-title">Black circle</title>
      <circle cx="200" cy="200" r="200" fill="#000"/>
    </svg>
  </main>
</body>
</html>
