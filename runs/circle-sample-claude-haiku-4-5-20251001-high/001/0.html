<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #ffffff;
      transition: fill 0.3s ease;
    }
    svg:hover circle {
      fill: #ffd700;
    }
    h1 {
      color: white;
      font-size: 28px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Circle</h1>
    <svg id="ae683f770" viewBox="0 0 400 400" role="img" aria-label="A white circle with hover effect">
      <circle cx="200" cy="200" r="180"/>
    </svg>
  </div>
</body>
</html>
