<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
      transition: transform 0.3s ease;
    }
    svg:hover {
      transform: scale(1.05);
    }
    circle {
      fill: #fff;
      stroke: #667eea;
      stroke-width: 3;
      transition: all 0.3s ease;
    }
    svg:hover circle {
      fill: #f0f0ff;
      stroke-width: 4;
    }
    h1 {
      color: white;
      font-size: 32px;
      font-weight: 600;
    }
    p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Circle</h1>
    <svg id="circle-svg" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="180"/>
    </svg>
    <p>Hover over the circle to see the effect</p>
  </div>
</body>
</html>
