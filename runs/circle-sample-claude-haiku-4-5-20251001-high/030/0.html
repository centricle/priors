<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }
    circle {
      fill: #ffffff;
      stroke: #667eea;
      stroke-width: 3;
      transition: all 0.3s ease;
    }
    svg:hover circle {
      stroke-width: 6;
      filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6));
    }
  </style>
</head>
<body>
  <svg id="circle-visualization" viewBox="0 0 400 400" role="img" aria-label="A circular design element">
    <defs>
      <radialGradient id="circleGradient" cx="35%" cy="35%">
        <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#circleGradient)"/>
  </svg>
</body>
</html>
