<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A centered gradient circle animation">
  <title>Circle Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    svg {
      width: 400px;
      height: 400px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.2));
      animation: float 3s ease-in-out infinite;
    }
    circle {
      fill: url(#gradient);
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 2;
      transition: filter 0.3s ease;
    }
    svg:hover circle {
      filter: brightness(1.1);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      color: white;
      font-size: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 400 400">
      <defs>
        <radialGradient id="gradient" cx="40%" cy="40%">
          <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#19547b;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="200"/>
    </svg>
    <h1>Circle Design</h1>
  </div>
</body>
</html>
