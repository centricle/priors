<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Visualization</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
    }
    svg {
      width: 400px;
      height: 400px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    circle {
      fill: #007bff;
      stroke: #0056b3;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <svg id="ae683f770" viewBox="0 0 400 400" aria-label="Blue circle visualization">
    <circle cx="200" cy="200" r="200"/>
  </svg>
</body>
</html>
