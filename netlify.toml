# Built from site/ and served through a path-preserving proxy at
# https://centricle.com/curios/priors/. The upstream host serves the same
# prefix (see site/scripts/stage-base.mjs), so header rules carry it too.
#
# The renders (/r/, /t/) and the CSV downloads are not served from here: the
# images come from a Cloudflare Worker (site/cdn/config.mjs) and the CSVs from
# a GitHub release (bin/release-data.sh), because every byte Netlify sends
# counts against a bandwidth cap shared with centricle.com and every curio.
# The redirects below keep the old URLs working; they were live from
# 2026-10-01 and sit in shared links and image-search entries. The origin
# in the two image redirects is the same value as config.mjs, which TOML
# cannot import; site/scripts/check-assets.mjs fails the build if they differ.

[build]
  base = "site"
  command = "npm run build"
  # Relative to base, unlike the UI's field: "site/dist" here resolves to
  # site/site/dist (checked with @netlify/config's resolveConfig).
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/curios/priors/"
  status = 301

[[redirects]]
  from = "/curios/priors/trials.csv"
  to = "https://github.com/centricle/priors/releases/download/data/trials.csv"
  status = 302

[[redirects]]
  from = "/curios/priors/campaign-2.csv"
  to = "https://github.com/centricle/priors/releases/download/data/campaign-2.csv"
  status = 302

[[redirects]]
  from = "/curios/priors/r/*"
  to = "https://priors-assets.centricle.workers.dev/r/:splat"
  status = 301

[[redirects]]
  from = "/curios/priors/t/*"
  to = "https://priors-assets.centricle.workers.dev/t/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/curios/priors/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
